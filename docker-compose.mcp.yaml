# docker-compose.mcp.yaml — dev / smoke overlay.
#
# What it does:
#   1. Swaps the app services to the FORK images (they carry the 2026 migrations
#      matching the pre-seeded db-postgres volume + the service_account /
#      public-sharing work). Only these have a fork build: us, data-api,
#      control-api, ui, ui-api. postgres / auth / meta-manager / temporal stay on
#      the upstream images from the base compose.
#   2. Publishes the three internal APIs to the host (us 3030, data-api 8020,
#      control-api 8010) so the MCP Inspector / curl can reach them.
#   3. Adds the read-only `mcp` service on the same network. It reaches the APIs
#      by service DNS (http://us:8080, ...) and serves Streamable HTTP on
#      127.0.0.1:3399 of the host — the same transport production uses, so what
#      is exercised locally is what ships (see the workspace root .mcp.json).
#
# Usage — layer it over the base compose:
#   docker compose -f docker-compose.yaml -f docker-compose.mcp.yaml up -d
#
# Notes:
#   - Fork images are amd64-only; on Apple Silicon they run under emulation
#     (platform: linux/amd64) — the "requested image's platform ... does not
#     match" warnings are expected, not errors.
#   - Fork images are PRIVATE: `docker login ghcr.io` first.
#   - The `mcp` service itself builds for the host's native arch (plain Node) —
#     no emulation, fast build.
services:
  us:
    image: ghcr.io/factory-director-team/datalens-us:${FORK_TAG_US:-latest}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    ports:
      - "3030:8080"

  data-api:
    image: ghcr.io/factory-director-team/datalens-data-api:${FORK_TAG_BACKEND:-latest}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    ports:
      - "8020:8080"

  control-api:
    image: ghcr.io/factory-director-team/datalens-control-api:${FORK_TAG_BACKEND:-latest}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    ports:
      - "8010:8080"

  ui-api:
    image: ghcr.io/factory-director-team/datalens-ui:${FORK_TAG_UI:-latest}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}

  ui:
    image: ghcr.io/factory-director-team/datalens-ui:${FORK_TAG_UI:-latest}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}

  # --- read-only MCP server --------------------------------------------------
  mcp:
    container_name: datalens-mcp
    build:
      context: ../datalens-mcp
    environment:
      # In-network service DNS (container-to-container), NOT the published host
      # ports. The MCP container shares the compose network with the APIs.
      DATALENS_US_URL: http://us:8080
      DATALENS_DATA_API_URL: http://data-api:8080
      DATALENS_CONTROL_API_URL: http://control-api:8080
      # The ui BFF — the fourth internal API, needed by the chart tools. It is
      # the only one reached by cookie rather than bearer; the server signs that
      # cookie with the key below. See ADR-0008.
      DATALENS_UI_URL: http://ui:8080
      # Identity the server acts as. Default = the pre-seeded admin of the
      # 2026-04 db-postgres volume (see the runbook for how to look it up).
      # BARE id, no `uid:` prefix — United Storage adds that itself when it
      # records authorship, and a prefixed claim lands in the data as `uid:uid:`.
      DATALENS_IDENTITY_USER_ID: ${DATALENS_IDENTITY_USER_ID:-pyu7tsvjfh1q9}
      DATALENS_IDENTITY_ROLES: ${DATALENS_IDENTITY_ROLES:-datalens.admin}
      # --- Streamable HTTP -----------------------------------------------
      # 0.0.0.0 inside the container; only 127.0.0.1:3399 is published to the host.
      DATALENS_MCP_HTTP_HOST: 0.0.0.0
      DATALENS_MCP_HTTP_PORT: "3000"
      # `label:token` per consumer — drop a line to revoke exactly one caller.
      # A credential is required even locally: one code path, no dev-only bypass.
      DATALENS_MCP_BEARERS: ${DATALENS_MCP_BEARERS:-local:local-dev-bearer}
      # Signs the PS256 platform token. Deliberately tracks the stack's
      # AUTH_TOKEN_PRIVATE_KEY: its public half is the containers'
      # AUTH_TOKEN_PUBLIC_KEY, so US / data-api verify the token the MCP mints.
      # The default is the same dev key baked into the base compose.
      DATALENS_AUTH_TOKEN_PRIVATE_KEY: ${AUTH_TOKEN_PRIVATE_KEY:------BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQD4cgINkx+KYwiI\nZ13R0+vY3fPEc4mqJVe69SP9oEFLtzzvrSslSHjfjiw//QaJ3nnzIf+/Uy3NnRH3\nDT2/qBtI2tKI3AhQ0Y+Fueb0l/6Qx7Owj+uRwh2hWbconwIVRjLoxE/NbuImYhVE\ncFvza/WYBgIJAVTohG0Uhr2FDzB51bDGpdl6RI1L7o0Hft2aZAH2TPYTcxj4pEuK\nA6HiLekJnW2LcdW8xr1GWCT0WahYTHO5vkQIKGrCb6+fzIVeNhbuRRIKVxXbHHid\ntBaqOtHLIuTpbYE064IVW/PSP7leSksC3u2WO1Vlz7nvYcEQqkXaYB2YCKnk3N4O\nEqq5wn5lAgMBAAECggEAKxtE5ewP/efe9CPTMHPvqOohwIU3bpEaHrMn8nqaubNq\nXD+Ui9x+NHOrk9KoDsXOLPRKNn0NJm7JTi869oUJbuOgweRDgRpLJ62wt+GjZqVv\ntQPToK+oinVRhTfJmb1bWe2t1vwVOwmrnPtNyPeDXkQ0mDFl9Q39CyGxwmN3SrwE\ncwKM9vFXxiH60T2UHok7/BW7Usb+4WJA4ov/bEoYAzkDQUnnRzjJO1RXFWjC8//M\nXjuI0NZsQXK3LV9yukSONInevoc1MnoGHwe9UZ67tDnJigY9rd4fT6B1yiKuzLDv\noiDPdpm3plh/JnPLM16nOm7zJkmsbKG2RwfzUmLNxQKBgQD827lAPp3ePUrmRQQb\nXwqb4zNQZgDUBQc0bU6F1BxWQtx5LTafnjOYmqqhakpZrMDh69T/TwH8kbDutXcR\nMWAO96yZ1IYRqsrorz4i4bCww1wDTpn7Aqz0xPkJqAucrfkUYoELf/Fl4P1dq4bs\n4OkuMLtHefI2qd/3utQOhEnauwKBgQD7iD94k9RHpHL0vb4n4Jb2EC4I/se3J1Ls\n0F37veMCQXOFKuWrka81DsqdRxu/wqZI4fkMnIe7NjGro2FFZg8MA3i4I6v3KRv9\nRyTrLNXspIESjZ2oAkuVT9npRf86whvZa2H3n4bIowJHwak3lF63xq6jnVZlCkQL\nTEhlRMFJXwKBgAmMlrtpYfbho7F8i8Io3bKzat2vbHqVUgdV1XBSaVuMnNzqqzRt\n+g7aUHVWGUa3snUVve6CYlXSfrcVHVEF51XJXrhUgVerdoxBCfyxP0X9qrzpPAFx\nwWxg//KwaPfazhxJ+AuiIlCxpX/jGW5atBOtfXUektojojSt1pJRxqQ/AoGAPcXd\nSKCNjratYLvEmoiGqpGYrK7dn3Zx4CTgH/YnbSNj2n2JgBQ8QjyKuAuBnhuQuO9+\nOYGrt+d8VVm/hsqkwV+M4zQnhIC9FfvF7lfJhd90r3jGEj/WDipZKvf80ZJgQooj\nuiucb2PRKIxAIZ03kcyikR4P3KqjwV6PnQdArOMCgYBwBq8mBNlJwYUuLruQ1RM7\n5LbP1e8C/YZ75N3CLPA14kDoW8qYC6X+KCQQgPXlQGDvTzAxg382NV53704H4ZAh\nPVuwnoZzVs9VgOHduu8nUHHzh8+ukl+fX9dyzq/wjulx8fXcRewTXh9I892EjcJy\nBG41O8RqoSHlssbZaJnugw==\n-----END PRIVATE KEY-----}
      DATALENS_MCP_LOG_LEVEL: ${DATALENS_MCP_LOG_LEVEL:-info}
      # Empty means unrestricted; set a comma-separated list of workbook ids to
      # confine the server to them (ADR-0009).
      DATALENS_MCP_ALLOWED_WORKBOOKS: ${DATALENS_MCP_ALLOWED_WORKBOOKS:-}
    ports:
      # Loopback only — the endpoint is not exposed to the LAN.
      - "127.0.0.1:3399:3000"
    healthcheck:
      # node:24-alpine ships no curl.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - us
      - data-api
      - control-api
    networks:
      - default
